<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23c9f27a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2312130f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="9" fill="#c9f27a"/>
    <circle cx="16" cy="16" r="9" fill="none" stroke="#12130f" stroke-width="2" stroke-dasharray="40 16" stroke-linecap="round" transform="rotate(-50 16 16)"/>
    <circle cx="16" cy="16" r="3.2" fill="#12130f"/>
    <path d="M6 26 26 6" stroke="#12130f" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="logo"><use href="#logo"/></svg>
      <div><div class="brand-name">Offline AI</div><div class="brand-sub">Powered by Ollama</div></div>
    </div>
    <button class="new-chat" id="newChat">+ New Chat</button>
    <div class="side-label">Chats</div>
    <nav class="history" id="history" aria-label="Chat history"></nav>
    <button class="clear-all" id="clearAll">Clear all chats</button>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking Ollama…</span></div>
    <div class="side-foot">Local processing • No cloud API key</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="model-wrap">
        <select id="modelSelect" aria-label="Model"></select>
      </div>
      <div class="seg" id="modeSeg"><button data-mode="chat" class="on">Chat</button><button data-mode="image">Image</button></div>
    </header>

    <section class="scroller" id="scroller">
      <div class="empty" id="empty">
        <svg class="logo big"><use href="#logo"/></svg>
        <h1>Your local AI assistant</h1>
        <p>Private AI running directly on your computer.</p>
        <div class="cards">
          <button class="card" data-prompt="Explain how a computer processor works, in simple terms."><b>Explain something</b><span>Break down any topic simply</span></button>
          <button class="card" data-prompt="Help me code a JavaScript function that removes duplicates from an array."><b>Help me code</b><span>Write, debug, and review code</span></button>
          <button class="card" data-prompt="Brainstorm 5 project ideas I can build in a weekend with Node.js."><b>Brainstorm a project</b><span>Find ideas and plan next steps</span></button>
          <button class="card" data-prompt="Summarize the following text in 3 bullet points:&#10;&#10;"><b>Summarize text</b><span>Condense long writing</span></button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-wrap">
      <div class="imgopts" id="imgOpts" hidden>
        <label>Size <select id="imgSize"><option>512</option><option>640</option><option>768</option></select></label>
        <label>Steps <input id="imgSteps" type="number" min="1" max="60" value="20"></label>
        <label>CFG <input id="imgCfg" type="number" min="1" max="20" step="0.5" value="7"></label>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message your local AI…" aria-label="Message"></textarea>
        <button class="send" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="send stop" id="stopBtn" aria-label="Stop generating" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
        </button>
      </div>
      <div class="hint">Runs locally through Ollama. Your conversations stay on this device.</div>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
